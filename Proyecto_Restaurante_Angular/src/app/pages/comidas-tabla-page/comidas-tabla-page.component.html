<app-table-navbar></app-table-navbar>

<app-table-hero-banner></app-table-hero-banner>

<section id="menu-tabla" class="menu-section container my-5">
  @if (error) { <p class="alert alert-danger" role="alert">{{ error }}</p> }
  <div class="separador-menu mb-5">
    <div class="linea-decorativa"></div>
    <h2 class="titulo-menu">Menú</h2>
    <div class="linea-decorativa"></div>
  </div>
  <div class="d-flex justify-content-end mb-4">
    <a routerLink="/comidas/tabla/add" class="btn-cafe-agregar">
      <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar plato
    </a>
  </div>
  <app-comida-table
    [comidas]="comidas"
    (comidaEliminada)="eliminarComida($event)"
    (comidaActivada)="activarComida($event)"
  ></app-comida-table>
</section>

<app-footer></app-footer>

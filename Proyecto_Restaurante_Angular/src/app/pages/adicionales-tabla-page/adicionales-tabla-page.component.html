<app-table-navbar></app-table-navbar>

<section id="adicionales-tabla" class="adicionales-section container my-5">
  @if (error) { <p class="alert alert-danger" role="alert">{{ error }}</p> }
  <div class="separador-adicionales mb-5">
    <div class="linea-decorativa"></div>
    <h1 class="titulo-adicionales">Adicionales</h1>
    <div class="linea-decorativa"></div>
  </div>
  <div class="d-flex justify-content-end mb-4">
    <a routerLink="/adicionales/tabla/add" class="btn-cafe-agregar">
      <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar adicional
    </a>
  </div>
  <app-adicional-table
    [adicionales]="adicionales"
    [categorias]="categorias"
    (adicionalEliminado)="eliminarAdicional($event)"
    (adicionalActivado)="activarAdicional($event)"
  ></app-adicional-table>
</section>

<app-footer></app-footer>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${comida.nombre} + ' | Crustáceo Caribeño'">Detalle del plato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/comida-detalle.css">
</head>
<body>
  <header class="header-crustaceo">
    <nav class="navbar-crustaceo">
        <div class="nav-contenido">

            <!-- Logo y nombre -->
            <a class="navbar-brand" th:href="@{/home}">
                <img src="/images/logo2.png"
                     alt="Logo de Crustáceo Caribeño"
                     width="48"
                     height="48">

                <span>Crustáceo Caribeño</span>
            </a>

            <!-- No mostrar botones de autenticación en la página de detalle -->
            <div class="nav-botones"></div>
        </div>
    </nav>
  </header>
  <main class="pagina-detalle">
    <h1 class="categoria" th:text="${comida.categoria.nombre}">Categoria del plato</h1>
    <section class="tarjeta-plato" aria-label="Detalle del plato">
      <img class="imagen-plato" th:src="@{${comida.imagenURL}}" th:alt="${comida.nombre}">
      <div class="informacion-plato">
        <h2 th:text="${comida.nombre}">Nombre del plato</h2>
        <p th:text="${comida.descripcion}">Descripción del plato.</p>
      </div>
      <p class="precio" th:text="'$' + ${#numbers.formatDecimal(comida.precio, 0, 'POINT', 0, 'COMMA')}">$0</p>
    </section>
    <section class="acompanamientos" aria-labelledby="titulo-acompanamientos">
      <h2 id="titulo-acompanamientos">Acompañamientos</h2>
      <p class="instruccion">¿Puede agregar algún acompañamiento a este producto?</p>
      <form id="form-agregar-carrito" th:action="@{/carrito/agregar}" method="post">
      <input th:if="${cliente != null}" type="hidden" name="clienteId" th:value="${cliente.idCliente}">
      <input type="hidden" name="productoId" th:value="${comida.idProducto}">
      <label class="opcion-acompanamiento" th:each="adic : ${adicionales}">
        <input type="checkbox" name="adicionales" th:value="${adic.idAdicional}">
        <span th:text="${adic.nombre}">Nombre adicional</span>
        <strong th:text="'$' + ${#numbers.formatDecimal(adic.precio, 0, 'POINT', 0, 'COMMA')}">$0</strong>
      </label>
      </form>
      <p class="sin-adicionales" th:if="${adicionales == null or adicionales.isEmpty()}">No hay adicionales disponibles para esta categoría.</p>
    </section>
    <div class="acciones-detalle">
      <button th:if="${cliente != null}" class="boton-detalle" type="submit" form="form-agregar-carrito">Agregar al carrito</button>
      <a class="boton-detalle" th:href="${cliente != null} ? @{/comidas/tarjetas(id=${cliente.idCliente})} : @{/comidas/tarjetas}">Volver</a>
    </div>
  </main>
</body>
</html>

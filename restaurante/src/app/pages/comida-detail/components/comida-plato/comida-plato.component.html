<h1 class="categoria">{{ comida.categoria }}</h1>
<section class="tarjeta-plato" aria-label="Detalle del plato">
  <img class="imagen-plato" [src]="comida.imagenURL" [alt]="comida.nombre">
  <div class="informacion-plato">
    <h2>{{ comida.nombre }}</h2>
    <p>{{ comida.descripcion }}</p>
  </div>
  <p class="precio">{{ comida.precio | currency:'COP':'symbol-narrow':'1.0-0':'es-CO' }}</p>
</section>

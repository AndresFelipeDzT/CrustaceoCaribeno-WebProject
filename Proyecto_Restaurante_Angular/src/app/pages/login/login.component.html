<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Login</h1>
    <form [formGroup]="loginForm" (ngSubmit)="ingresar()" novalidate>
      <div class="field">
        <label for="correo">Correo</label>
        <input id="correo" type="email" formControlName="correo" autocomplete="email" [class.invalid]="loginForm.controls.correo.touched && loginForm.controls.correo.invalid">
        @if (loginForm.controls.correo.touched && loginForm.controls.correo.invalid) {
          <small>Ingresa un correo válido.</small>
        }
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" [class.invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid">
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <small>La contraseña es obligatoria.</small>
        }
      </div>
      @if (error) {
        <p class="error-message" role="alert">{{ error }}</p>
      }
      <div class="actions">
        <button type="submit">Ingresar</button>
        <a routerLink="/">Cancelar</a>
      </div>
    </form>
  </section>
</main>

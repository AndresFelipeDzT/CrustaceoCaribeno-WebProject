<header class="pedidos-header">
  <a class="pedidos-brand" [routerLink]="esOperador ? ['/operador/pedidos'] : ['/pedidos']">
    <img src="/imagenes/logo2.png" alt="Logo Crustáceo Caribeño">
    <span>Crustáceo Caribeño</span>
  </a>
  <nav class="pedidos-nav">
    <a [routerLink]="esOperador ? ['/operador/pedidos'] : ['/pedidos']">Pedidos</a>
    @if (!esOperador) {
      <a routerLink="/domiciliarios">Domiciliarios</a>
      <a routerLink="/operadores">Operadores</a>
      <a routerLink="/comidas/tabla">Comidas</a>
      <a routerLink="/adicionales/tabla">Adicionales</a>
    }
    <a routerLink="/cerrar-sesion">Cerrar sesión</a>
  </nav>
</header>

@if (pedido; as actual) {
  <app-pedido-detalle
    [pedido]="actual"
    [estado]="estado"
    [estados]="estadosDisponibles"
    [siguienteEstado]="siguienteEstado"
    [puedeCancelar]="puedeCancelar"
    [esOperador]="esOperador"
    [domiciliariosDisponibles]="domiciliariosDisponibles"
    [idDomiciliarioSeleccionado]="idDomiciliarioSeleccionado"
    [mensaje]="mensaje"
    [error]="error"
    (estadoChange)="cambiarEstado($event)"
    (domiciliarioChange)="idDomiciliarioSeleccionado = $event"
    (actualizarEstado)="actualizarEstado()"
  ></app-pedido-detalle>
} @else {
  <app-pedidos-lista
    [pedidos]="pedidos"
    [esOperador]="esOperador"
    [mensaje]="mensaje"
    [error]="error"
    (pedidoEliminado)="eliminarPedido($event)"
  ></app-pedidos-lista>
  @if (!esOperador) { <app-estadisticas-ventas></app-estadisticas-ventas> }
}

<app-landing-footer></app-landing-footer>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iniciar sesión en Crustáceo Caribeño - El auténtico sabor del mar Caribe.">
  <title>Login | Crustáceo Caribeño</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" th:href="@{/images/logo2.png}">

  <!-- Google Fonts: Playfair Display & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos del Login -->
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">

  <main class="login-wrapper">
    <div class="login-card">
      <h2 class="login-title">Login</h2>

      <!-- Alertas de error (Cliente JS o Spring Boot) -->
      <div id="alertaJs" class="login-alert d-none" role="alert"></div>
      <div th:if="${error}" class="login-alert" th:text="${error}" role="alert"></div>

      <form id="formLogin" th:action="@{/login}" method="post">
        <div class="campo-grupo">
          <label for="txtNombre" class="login-label">Nombre</label>
          <input
            type="text"
            id="txtNombre"
            name="nombre"
            class="login-input"
            autocomplete="username"
            required
          />
        </div>

        <div class="campo-grupo">
          <label for="txtPassword" class="login-label">Contraseña</label>
          <input
            type="password"
            id="txtPassword"
            name="password"
            class="login-input"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="login-acciones">
          <button type="submit" class="btn-login-accion" id="btnIngresar">Ingresar</button>
          <a th:href="@{/home}" class="btn-login-accion btn-cancelar" id="btnCancelar">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <script th:src="@{/js/login.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Regístrate en Crustáceo Caribeño y disfruta de los mejores sabores del mar Caribe.">
  <title>Signup | Crustáceo Caribeño</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" th:href="@{/images/logo2.png}">

  <!-- Google Fonts: Playfair Display & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos del Signup / Registro -->
  <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body class="registro-body">

  <main class="registro-wrapper">
    <div class="registro-card">
      <h2 class="registro-title">Signup</h2>

      <!-- Alertas de error (Cliente JS o Spring Boot) -->
      <div id="alertaJs" class="registro-alert d-none" role="alert"></div>
      <div th:if="${error}" class="registro-alert" th:text="${error}" role="alert"></div>

      <form id="formRegistro" th:action="@{/registro}" method="post">
        <div class="campo-grupo">
          <label for="txtNombreCompleto" class="registro-label">Nombre Completo</label>
          <input
            type="text"
            id="txtNombreCompleto"
            name="nombreCompleto"
            class="registro-input"
            autocomplete="name"
            required
          />
        </div>

        <div class="campo-grupo">
          <label for="txtCorreo" class="registro-label">Correo</label>
          <input
            type="email"
            id="txtCorreo"
            name="correo"
            class="registro-input"
            autocomplete="email"
            required
          />
        </div>

        <div class="campo-grupo">
          <label for="txtTelefono" class="registro-label">Teléfono</label>
          <input
            type="tel"
            id="txtTelefono"
            name="telefono"
            class="registro-input"
            autocomplete="tel"
            required
          />
        </div>

        <div class="campo-grupo">
          <label for="txtDireccion" class="registro-label">Dirección</label>
          <input
            type="text"
            id="txtDireccion"
            name="direccion"
            class="registro-input"
            autocomplete="street-address"
            required
          />
        </div>

        <div class="campo-grupo">
          <label for="txtPassword" class="registro-label">Contraseña</label>
          <input
            type="password"
            id="txtPassword"
            name="password"
            class="registro-input"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="registro-acciones">
          <button type="submit" class="btn-registro-accion" id="btnRegistrarse">Registrarse</button>
          <a th:href="@{/home}" class="btn-registro-accion btn-cancelar" id="btnCancelar">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <script th:src="@{/js/registro.js}"></script>
</body>
</html>
